<template>
  <require from="./task-item/task-item"></require>
  <header>
    Oppgaver
    <vd-icon icon="launch" icon-type="material" click.delegate="newTab()" if.bind="openable"></vd-icon>
  </header>
  <div class="task-list" ref="listElement">
    <task-item repeat.for="task of items" task.bind="task" draggable="true" dragstart.delegate="dragstart($event, task)"></task-item>
  </div>
</template>
