<template>
  <require from="./vehicle-item/vehicle-item"></require>
  <header>
    Kjøretøy
    <vd-icon icon="launch" icon-type="material" click.delegate="newTab()" if.bind="openable"></vd-icon>
  </header>
  <div class="vehicle-list" ref="listElement">
    <div class="times">
      <div repeat.for="t of times">
        ${t}
      </div>
    </div>
    <vehicle-item repeat.for="vehicle of items" vehicle.bind="vehicle" draggable="true" dragstart.delegate="dragstart($event, vehicle)"></vehicle-item>
  </div>
</template>
