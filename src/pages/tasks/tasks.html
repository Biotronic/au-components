<template>
  <vd-calendar-day-vertical>
    <template replace-part="header">
      ${row.firstName} ${row.lastName}
    </template>
    <template replace-part="item" data-foo.bind="item">
      Text
    </template>
  </vd-calendar-day-vertical>

  <div class="tasks-container">
    <vd-draggable type="task" data.bind="task" repeat.for="task of tasks">
      Drag this:
      <br>
      ${task.title}
    </vd-draggable>
  </div>
</template>
