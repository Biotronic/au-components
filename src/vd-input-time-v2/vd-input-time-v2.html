<template ref="element" tabindex="0" focusout.delegate="handleFocusOut()">
  <vd-number-element-v2 value.two-way="daysValue" if.bind="days" min.bind="minDays" max.bind="maxDays" length.bind="2" placeholder="--" default-value.bind="defaultDays" step.bind="stepDays"></vd-number-element-v2>
  <span if.bind="days">${separator}</span>
  <vd-number-element-v2 value.two-way="hoursValue" min.bind="minHours" max.bind="maxHours" length.bind="2" placeholder="--" default-value.bind="defaultHours" step.bind="stepHours"></vd-number-element-v2>
  <span>${separator}</span>
  <vd-number-element-v2 value.two-way="minutesValue" min.bind="minMinutes" max.bind="maxMinutes" length.bind="2" placeholder="--" default-value.bind="defaultMinutes" step.bind="stepMinutes"></vd-number-element-v2>
  <span if.bind="seconds">${separator}</span>
  <vd-number-element-v2 value.two-way="secondsValue" if.bind="Seconds" min.bind="minSeconds" max.bind="maxSeconds" length.bind="2" placeholder="--" default-value.bind="defaultSeconds" step.bind="stepSeconds"></vd-number-element-v2>
  <vd-icon icon="schedule" icon-type="material" click.delegate="toggle()" length.bind="2"></vd-icon>
  <vd-popup-v2 visibility.two-way="popped">
    Hello world!
  </vd-popup-v2>
</template>
